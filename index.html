<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4POWER · Invoice Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&family=Raleway:wght@300;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1C3E; --navy-mid:#1E2B45; --lime:#A3E635; --teal:#0FB39A;
  --blue:#1478DC; --blue-h:#0F62BB; --emerald:#10B981;
  --s1:#F5F4F0; --s2:#EDECE7; --s3:#E2E0D8; --white:#fff;
  --tx:#0B1C3E; --tx2:#4A5568; --mut:#8A93A2; --bd:#D8D6CE; --bds:#E8E6DF;
  --r:8px; --disp:'Raleway',sans-serif; --body:'Manrope',sans-serif; --inv:'Poppins',sans-serif;
  --cream:#F4F2EC; --totlime:#A3E634; --ftsub:#B7C5DC; --ftcopy:#8FA3C2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--s2);color:var(--tx);font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;
  background:var(--navy);color:#fff;padding:12px 22px;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.topbar .brand{display:flex;align-items:center;gap:12px}
.topbar .brand svg{height:30px;width:auto;display:block}
.topbar .ttl{font-family:var(--disp);font-weight:300;font-size:15px;letter-spacing:.02em;opacity:.85}
.topbar .ttl b{font-weight:800}
.modewrap{margin-left:8px;display:inline-flex;background:rgba(255,255,255,.08);border-radius:30px;padding:3px}
.modewrap select{border:0;background:transparent;color:#fff;padding:7px 14px;border-radius:30px;
  font-weight:600;font-size:12.5px;cursor:pointer;outline:none}
.modewrap select option{color:var(--navy)}
.acts{margin-left:auto;display:flex;gap:9px}
.btn{border:0;border-radius:var(--r);padding:9px 15px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:var(--blue-h)}
.btn-g{background:var(--emerald);color:#fff}.btn-g:hover{filter:brightness(.94)}
.btn-s{background:transparent;color:#dfe6f2;border:1.5px solid rgba(255,255,255,.28)}.btn-s:hover{border-color:#fff}

.layout{display:grid;grid-template-columns:430px 1fr;gap:0;height:calc(100vh - 56px)}
.controls{overflow-y:auto;padding:22px 22px 80px;background:var(--s1);border-right:1px solid var(--bd)}
.wbar{display:flex;gap:6px;margin-bottom:18px}
.wtab{flex:1;border:0;background:var(--s2);color:var(--mut);border-radius:8px;padding:9px 4px;font-weight:600;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.wtab span{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--mut);align-items:center;justify-content:center;font-size:10px}
.wtab.on{background:var(--navy);color:#fff}.wtab.on span{background:var(--lime);color:var(--navy)}
.wtab.done span{background:var(--emerald);color:#fff}
.wstep{display:none}.wstep.on{display:block}
.wnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--bd)}
.rvok{background:#D1F5EB;color:#059669;padding:13px 15px;border-radius:8px;font-weight:600;font-size:13px}
.rvbad{background:#FEE2E2;color:#DC2626;padding:13px 15px;border-radius:8px;font-size:13px}
.rvbad ul{margin:7px 0 0 16px}.rvbad li{margin:3px 0}
.stage{overflow-y:auto;padding:34px;background:var(--s2);display:flex;justify-content:center}

.eyebrow{font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:22px 0 9px}
.eyebrow:first-child{margin-top:0}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--tx2);margin-bottom:4px;letter-spacing:.01em}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--bd);border-radius:7px;padding:8px 10px;background:#fff;transition:.12s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue) inset;box-shadow:0 0 0 3px rgba(20,120,220,.12)}
.fld textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row2 .fld{margin-bottom:0}
.hint{font-size:10.5px;color:var(--mut);margin-top:3px}
.ac{position:absolute;left:0;right:0;top:100%;z-index:60;background:var(--white);border:1px solid var(--bd);
  border-radius:var(--r);box-shadow:0 8px 24px rgba(11,28,62,.12);max-height:264px;overflow-y:auto;margin-top:4px}
.ac-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--bds)}
.ac-item:last-child{border-bottom:0}
.ac-item:hover,.ac-item.on{background:var(--s2)}
.ac-item .sub{display:block;font-size:11px;color:var(--mut);margin-top:1px}
.ac-empty{padding:9px 12px;font-size:12.5px;color:var(--mut)}

.items{margin-top:6px}
.itrow{background:#fff;border:1px solid var(--bd);border-radius:9px;padding:11px;margin-bottom:9px;position:relative}
.itrow .top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.itrow .top .num{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.itrow .top select{flex:1}
.itrow .rm{border:0;background:var(--s2);color:var(--tx2);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;flex-shrink:0}
.itrow .rm:hover{background:#FEE2E2;color:#DC2626}
.itrow .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.itrow .grid .fld{margin-bottom:0}
.itrow .grid .full{grid-column:1/3}
.itrow input,.itrow select{padding:6px 8px;font-size:12.5px}
.itrow .lbl{font-size:10px}
.additm{width:100%;border:1.5px dashed var(--bd);background:#fff;color:var(--blue);border-radius:8px;padding:10px;font-weight:600;cursor:pointer;transition:.12s}
.additm:hover{border-color:var(--blue);background:var(--s1)}

details.cat{margin-top:14px;border:1px solid var(--bd);border-radius:9px;background:#fff;padding:0 12px}
details.cat summary{cursor:pointer;font-weight:700;font-size:12px;padding:11px 0;color:var(--tx);list-style:none}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary::before{content:'▸ ';color:var(--blue)}
details.cat[open] summary::before{content:'▾ '}
.catrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 0;border-top:1px solid var(--bds)}
.catrow input{padding:5px 7px;font-size:11.5px}
.catrow .x{grid-column:1/3;text-align:right}
.catrow .x button{border:0;background:none;color:#DC2626;cursor:pointer;font-size:11px}
.miniadd{margin:8px 0 12px;border:0;background:var(--s2);border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:12px}

/* ---------- INVOICE SHEET (print target) ---------- */
.sheet{width:794px;min-height:1123px;background:#fff;box-shadow:0 6px 30px rgba(11,28,62,.12);
  padding:40px 40px 0;display:flex;flex-direction:column;font-family:var(--inv);font-size:11px;color:var(--navy)}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:8px}
.sheet .hd svg{height:50px;width:auto}
.sheet .doctitle{font-family:var(--inv);font-weight:500;font-size:34px;color:var(--navy);text-align:right;line-height:1;text-transform:capitalize}
.sheet .doctitle b{font-weight:500}

.sheet .meta{display:grid;grid-template-columns:1fr 330px;gap:18px;padding:6px 0 0;align-items:start}
.sheet .co{font-size:11px;color:var(--navy);line-height:1.7}
.sheet .co .nm{font-weight:600;font-size:11px;margin-bottom:1px}
.sheet .co .ln{font-weight:300}
.mtbl{width:100%;border-collapse:separate;border-spacing:0 3px}
.mtbl td{vertical-align:middle}
.mtbl td.k{background:var(--cream);color:var(--navy);font-weight:500;font-size:10px;padding:5px 9px;width:160px;white-space:nowrap}
.mtbl td.v{padding:5px 9px;font-weight:400;font-size:11px;color:var(--navy);text-align:left}
.rule{height:2px;background:var(--lime);border:0;margin:11px 0}

.addrs{display:grid;grid-template-columns:1fr 1fr 330px;gap:18px;padding:0;align-items:start}
.addrs .bx .h{display:inline-block;background:var(--cream);font-weight:500;font-size:11px;color:var(--navy);padding:3px 9px;margin-bottom:6px}
.addrs .bx .nm{font-weight:600;font-size:11px;margin-bottom:2px}
.addrs .bx .ln{font-weight:300;font-size:11px;line-height:1.55;white-space:pre-line}

table.lines{width:100%;border-collapse:collapse;margin-top:0}
table.lines thead th{background:var(--navy);color:#fff;font-family:var(--inv);font-weight:400;font-size:8.8px;
  line-height:1.2;padding:7px 5px;text-align:center;vertical-align:middle}
table.lines thead th.l{text-align:left}
table.lines tbody td{padding:9px 5px;font-size:10px;font-weight:400;border-bottom:1px solid var(--bds);text-align:center;vertical-align:middle}
table.lines tbody td.l{text-align:left;vertical-align:top}
table.lines tbody .li-desc{font-size:10px;font-weight:400;color:var(--navy)}
table.lines tbody .li-sub{font-size:8px;font-weight:500;color:var(--mut);margin-top:2px;letter-spacing:.02em}
table.lines tbody tr.blank td{height:26px}
.col-no{width:24px}.col-qty{width:30px}
.signoff{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding-top:4px}
.signoff .so .h{display:inline-block;background:var(--cream);font-weight:500;font-size:10px;color:var(--navy);padding:3px 9px;margin-bottom:16px}
.signoff .soline{border-top:1px solid var(--bd);padding:5px 0 16px;font-size:9px;color:var(--mut)}
.col-ser{width:110px}
.checklist .h{display:inline-block;background:var(--cream);font-weight:500;font-size:10px;color:var(--navy);padding:3px 9px;margin-bottom:8px}
.checklist .ck{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:10px;color:var(--navy)}
.checklist .ck .box{width:11px;height:11px;border:1.4px solid var(--navy);border-radius:2px;flex:none}
.sheet .ed{outline:none;border-radius:3px;cursor:text;transition:background .12s;padding:0 2px;margin:0 -2px}
.sheet .ed:hover{background:#EBF5FD}
.sheet .ed:focus{background:#EBF5FD;box-shadow:0 0 0 2px rgba(20,120,220,.35)}
.sheet .ed:empty:before{content:attr(data-ph);color:#c2c8d0}

.totwrap{display:grid;grid-template-columns:1.18fr 1fr;gap:14px;margin-top:0;align-items:start}
.aiw .band{background:var(--navy);color:#fff;font-weight:500;font-size:10px;padding:6px 10px}
.aiw .r{display:grid;grid-template-columns:auto 1fr;border-bottom:1px solid var(--bds)}
.aiw .r .k{background:var(--cream);font-weight:400;font-size:9.5px;padding:6px 10px;white-space:nowrap}
.aiw .r .v{font-weight:400;font-size:9.5px;padding:6px 10px}
.sums table{width:100%;border-collapse:collapse}
.sums th{font-weight:500;font-size:10px;color:#fff;background:var(--navy);padding:6px 8px;text-align:right}
.sums th.l{text-align:left}
.sums td{padding:6px 8px;font-size:10px;text-align:right;border-bottom:1px solid var(--bds)}
.sums td.k{text-align:left;background:var(--cream);font-weight:400}
.sums tr.tot td{background:var(--totlime);color:var(--navy);font-weight:600;border:0}

.decl{margin-top:11px;background:var(--cream);padding:10px 12px}
.decl .h{font-weight:500;font-size:10px;margin-bottom:3px}
.decl p{font-size:8.5px;font-weight:300;line-height:1.55}
.remit2{margin-top:0;display:grid;grid-template-columns:1.18fr 1fr;gap:14px;align-items:start}
.remit2 .h{display:inline-block;background:var(--cream);font-weight:500;font-size:10px;color:var(--navy);padding:4px 9px;margin-bottom:7px}
.remit2 .bank{font-size:10px;font-weight:300;line-height:1.75}
.remit2 .remarks{min-height:58px}
.foot{margin:0 -40px 0;background:var(--navy);color:var(--ftsub);padding:20px 40px;
  display:flex;flex-direction:column;gap:4px}
.foot .ty{font-family:var(--inv);font-weight:500;font-size:16px;color:#fff;margin-bottom:7px}
.foot .lg{font-size:9px;font-weight:300;line-height:1.6}
.foot .cp{font-size:9px;font-weight:400;color:var(--ftcopy);margin-top:2px}

.empty-note{font-size:10.5px;color:var(--mut);font-style:italic}

@media print{
  @page{size:A4;margin:0 0 8mm 0;
    @bottom-right{content:"Page " counter(page) " of " counter(pages);
      font-family:'Poppins',sans-serif;font-size:8px;color:#0B1C3E;padding:0 13mm 4mm 0}}
  body{background:#fff}
  .topbar,.controls{display:none!important}
  .layout{display:block;height:auto}
  .stage{padding:0;overflow:visible;background:#fff;display:block}
  .sheet{width:auto;min-height:auto;box-shadow:none;padding:8mm 13mm 0;font-size:10px}
  .sheet .hd{padding-bottom:4px}
  .rule{margin:5px 0}
  .sheet .meta{padding-top:2px}
  table.lines tbody td{padding:6px 5px}
  table.lines tbody tr.blank td{height:9px}
  .decl{margin-top:7px;padding:8px 12px}
  .aiw .band,.sums th{padding:5px 8px}
  .aiw .r .k,.aiw .r .v,.sums td{padding:4px 8px}
  .foot{margin:0 -13mm 0;padding:11px 13mm}
  .foot .ty{margin-bottom:4px}
  table.lines thead{display:table-header-group}
  table.lines tr{break-inside:avoid}
  .totwrap,.decl,.remit2,.foot{break-inside:avoid}
  .sheet .ed{background:none!important;box-shadow:none!important}
  .sheet .ed:empty:before{content:'—';color:#000}
}
</style>
</head>

  <div class="modewrap">
    <select id="docTypeSel" onchange="setMode(this.value)" aria-label="Document type"></select>
  </div>
  <div class="acts">
    <button class="btn btn-s" onclick="newDoc()">New</button>
    <button class="btn btn-s" onclick="saveJSON()">Save .json</button>
    <button class="btn btn-s" onclick="document.getElementById('loadf').click()">Load .json</button>
    <input id="loadf" type="file" accept="application/json" style="display:none" onchange="loadJSON(event)">
    <button class="btn btn-g" id="logBtn" onclick="logToBigin()">Log to Bigin</button>
    <button class="btn btn-p" onclick="window.print()">Print / Save PDF</button>
  </div>
</div>

<div class="layout">
  <!-- ============ CONTROLS ============ -->
  <div class="controls">
    <div class="wbar" id="wbar">
      <button class="wtab on" data-s="1" onclick="goStep(1)"><span>1</span>Document</button>
      <button class="wtab" data-s="2" onclick="goStep(2)"><span>2</span>Customer</button>
      <button class="wtab" data-s="3" onclick="goStep(3)"><span>3</span>Items</button>
      <button class="wtab" data-s="4" onclick="goStep(4)"><span>4</span>Review</button>
    </div>
    <section class="wstep on" data-step="1">
    <div class="eyebrow">Document</div>
    <div class="row2">
      <div class="fld"><label id="lblTitle">Document Title</label><input id="docTitle"></div>
      <div class="fld"><label id="lblNum">Reference No.</label><input id="docNumber" placeholder="Type reference"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>Date of Invoice</label><input id="dateInvoice" type="date"></div>
      <div class="fld"><label>Date of Supply</label><input id="dateSupply" type="date"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>Our Reference</label><input id="ourRef" placeholder="—"></div>
      <div class="fld"><label>Project Name</label><input id="project" placeholder="Cash Deposit Machine"></div>
    </div>

    </section>
    <section class="wstep" data-step="2">
    <div class="eyebrow">Customer</div>
    <div class="fld">
      <label>Search Bigin</label>
      <div style="position:relative">
        <input id="custSearch" placeholder="Type a company name…" autocomplete="off" role="combobox" aria-expanded="false">
        <div id="custResults" class="ac" style="display:none"></div>
      </div>
      <div class="hint" id="custStatus">Type at least two characters to search Bigin.</div>
    </div>
    <div class="row2">
      <div class="fld"><label>Customer ID</label><input id="custId" placeholder="—"></div>
      <div class="fld"><label>Attention</label>
        <select id="contactSel" onchange="pickContact()" style="display:none;margin-bottom:6px"></select>
        <input id="attention" placeholder="—"></div>
    </div>
    <div class="fld" id="dealWrap" style="display:none">
      <label>Link a Bigin deal <span style="color:var(--mut);font-weight:400">— fills Our Ref</span></label>
      <select id="dealSel" onchange="pickDeal()"></select>
    </div>
    <div class="fld" id="createDealWrap" style="display:none">
      <button class="btn btn-g" id="createDealBtn" onclick="createBiginDeal()" style="width:100%">Create new deal in Bigin → generate Our Ref</button>
      <div class="hint">No existing deal? Create one at Quotations · Submit Quotation. Bigin assigns the Our Reference automatically.</div>
    </div>
    <div class="row2">
      <div class="fld"><label>Your Reference</label><input id="yourRef" placeholder="—"></div>
      <div class="fld"><label>PO Number</label><input id="poNumber" placeholder="—"></div>
    </div>
    <div class="fld"><label>Bill To (name)</label><input id="billName"></div>
    <div class="fld"><label>Bill To (address)</label><textarea id="billAddr"></textarea></div>
    <div class="fld"><label>Deliver To (name)</label><input id="delName"></div>
    <div class="fld"><label>Deliver To (address)</label><textarea id="delAddr"></textarea></div>

    </section>
    <section class="wstep" data-step="3">
    <div class="eyebrow">Terms &amp; settings</div>
    <div class="row2">
      <div class="fld"><label>Payment Terms</label>
        <select id="terms" onchange="recompute()">
          <option>Advance</option><option>Net 15</option><option selected>Net 30</option>
          <option>Net 45</option><option>Net 60</option><option>Net 90</option>
        </select>
      </div>
      <div class="fld"><label>Due Date (auto)</label><input id="dueDate" readonly style="background:var(--s2)"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>Declaration</label>
        <select id="decl" onchange="recompute()">
          <option value="export" selected>Export — zero-rated</option>
          <option value="domestic">Domestic — 5% VAT</option>
        </select>
      </div>
      <div class="fld"><label>USD → AED rate</label><input id="rate" type="number" step="0.0001" placeholder="e.g. 3.6725" oninput="recompute()"></div>
    </div>
    <div class="fld"><label>Remit account shown</label>
      <select id="remit" onchange="recompute()">
        <option value="both" selected>FAB — AED &amp; USD</option>
        <option value="aed">FAB — AED only</option>
        <option value="usd">FAB — USD only</option>
      </select>
    </div>

    <div class="eyebrow">Line items</div>
    <div class="items" id="items"></div>
    <button class="additm" onclick="addItem()">+ Add line item</button>

    <details class="cat">
      <summary>Manage product catalogue</summary>
      <div id="catList"></div>
      <button class="miniadd" onclick="addCat()">+ Add product</button>
    </details>
    </section>
    <section class="wstep" data-step="4">
    <div class="eyebrow">Review &amp; issue</div>
    <div id="reviewBox"></div>
    <div class="row2" style="margin-top:14px">
      <button class="btn btn-g" id="logBtn2" onclick="logToBigin()">Log to Bigin</button>
      <button class="btn btn-p" onclick="window.print()">Print / Save PDF</button>
    </div>
    </section>
    <div class="wnav">
      <button class="btn btn-s" id="wback" onclick="goStep(curStep-1)">← Back</button>
      <button class="btn btn-p" id="wnext" onclick="goStep(curStep+1)">Next →</button>
    </div>
  </div>

  <!-- ============ PREVIEW / PRINT SHEET ============ -->
  <div class="stage">
    <div class="sheet" id="sheet"></div>
  </div>
</div>

let catalogue=load('cat',defaultCatalogue);
let customers=load('cust',defaultCustomers);
let inv=blank('proforma');

function blank(mode){
  const t=new Date(); const iso=t.toISOString().slice(0,10);
  return{mode,docTitle:(CONFIG.docTypes[mode]||CONFIG.docTypes.proforma).title,docNumber:'',
    dateInvoice:iso,dateSupply:'',ourRef:'',project:'',
    custId:'',attention:'',yourRef:'',poNumber:'',
    billName:'',billAddr:'',delName:'',delAddr:'',
    terms:CONFIG.defaults.terms,decl:CONFIG.defaults.decl,rate:CONFIG.fx.default,remit:CONFIG.defaults.remit,
    items:[{part:'',desc:'',hsn:'',qty:1,price:0,vat:0}]};
}
function load(k,d){try{const v=localStorage.getItem('4p_inv_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem('4p_inv_'+k,JSON.stringify(v))}catch(e){}}

/* ---------------- helpers ---------------- */
function fmt(n){return (n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dmy(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
const ONES=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function below1000(n){let s='';if(n>=100){s+=ONES[Math.floor(n/100)]+' hundred';n%=100;if(n)s+=' '}if(n>=20){s+=TENS[Math.floor(n/10)];n%=10;if(n)s+='-'+ONES[n]}else if(n)s+=ONES[n];return s}
function words(n){n=Math.floor(n);if(n===0)return'zero';const sc=[['billion',1e9],['million',1e6],['thousand',1e3]];let s='';for(const[name,val]of sc){if(n>=val){s+=below1000(Math.floor(n/val))+' '+name+' ';n%=val}}if(n)s+=below1000(n);return s.trim()}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function amountWords(amt,cur){const i=Math.floor(amt+1e-6);const f=Math.round((amt-i)*100);let s=cap(words(i));if(f>0)s+=' and '+words(f)+(cur==='AED'?' fils':' cents');return s}

/* ---------------- compute ---------------- */
function compute(){
  const rate=parseFloat(inv.rate)||RATE_DEFAULT;
  let netT=0,vatT=0;
  const rows=inv.items.map(it=>{
    const qty=parseFloat(it.qty)||0,price=parseFloat(it.price)||0,vr=parseFloat(it.vat)||0;
    const filled=(it.desc||it.part)&&qty>0;
    const net=qty*price, vat=Math.round(net*vr/100*100)/100, tUSD=net+vat, tAED=tUSD*rate;
    if(filled){netT+=net;vatT+=vat}
    return{...it,filled,net,vat,tUSD,tAED};
  });
  const totUSD=netT+vatT, totAED=totUSD*rate;
  return{rate,rows,netT,vatT,totUSD,totAED};
}

/* ---------------- render preview ---------------- */
function render(){
  const c=compute();
  const dtR=CONFIG.docTypes[inv.mode]||CONFIG.docTypes.proforma;
  if(!dtR.pricing){renderSimpleDoc(dtR,c);return;}
  const filled=c.rows.filter(r=>r.filled);
  const minRows=Math.max(0,4-filled.length);
  let body='';let n=0;
  filled.forEach(r=>{n++;
    const sub=[ (r.part&&r.part!=='-')?('Part&nbsp;#&nbsp;'+esc(r.part)):'', (r.hsn&&r.hsn!=='-')?('HSN&nbsp;Code&nbsp;'+esc(r.hsn)):'' ].filter(Boolean).join('&nbsp;&nbsp;·&nbsp;&nbsp;');
    body+=`<tr>
    <td class="col-no">${n}</td>
    <td class="l"><div class="li-desc">${esc(r.desc)}</div>${sub?`<div class="li-sub">${sub}</div>`:''}</td>
    <td class="col-qty">${r.qty}</td>
    <td>USD ${fmt(r.price)}</td><td>USD ${fmt(r.net)}</td><td>${r.vat?(parseFloat(r.vat)||0):0}%</td>
    <td>USD ${fmt(r.vat)}</td><td>USD ${fmt(r.tUSD)}</td><td>AED ${fmt(r.tAED)}</td></tr>`});
  for(let i=0;i<minRows;i++)body+=`<tr class="blank"><td class="col-no"></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
  if(filled.length===0&&minRows===0)body=`<tr><td colspan="9" class="l empty-note">Add a line item to begin…</td></tr>`;

  const declText=CONFIG.declarations[inv.decl]||CONFIG.declarations.export;
  const fxStamp=inv.dateInvoice?(' (as at '+dmy(inv.dateInvoice)+')'):'';
  let acct;
  if(inv.remit==='aed')acct=`A/c # (AED) ${BANK.aedAc}`;
  else if(inv.remit==='usd')acct=`A/c # (US$) ${BANK.usdAc}`;
  else acct=`A/c # (AED) ${BANK.aedAc} | (US$) ${BANK.usdAc}`;
  const ibanRows=[];
  if(inv.remit!=='usd')ibanRows.push(`IBAN # (AED) ${BANK.aedIban}`);
  if(inv.remit!=='aed')ibanRows.push(`IBAN # (US$) ${BANK.usdIban}`);

  document.getElementById('sheet').innerHTML=`
  <div class="hd"><div>${LOGO_LIGHT}</div>
    <div class="doctitle">${ed('docTitle',inv.docTitle,'Document title')}</div></div>
  <div class="rule"></div>
  <div class="meta">

function bind(){
  const map={docTitle:'docTitle',docNumber:'docNumber',dateInvoice:'dateInvoice',dateSupply:'dateSupply',
    ourRef:'ourRef',project:'project',custId:'custId',attention:'attention',yourRef:'yourRef',poNumber:'poNumber',
    billName:'billName',billAddr:'billAddr',delName:'delName',delAddr:'delAddr'};
  Object.entries(map).forEach(([id,key])=>{const el=document.getElementById(id);el.addEventListener('input',()=>{inv[key]=el.value;recompute()})});
  ['terms','decl','rate','remit'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('change',()=>{inv[id]=el.value;recompute()})});
}
function syncForm(){
  inv.terms=document.getElementById('terms').value=inv.terms;
  ['docTitle','docNumber','dateInvoice','dateSupply','ourRef','project','custId','attention','yourRef','poNumber','billName','billAddr','delName','delAddr','rate','decl','remit'].forEach(id=>{if(document.getElementById(id))document.getElementById(id).value=inv[id]});
  document.getElementById('terms').value=inv.terms;
}
function recompute(){
  ['terms','decl','rate','remit','docNumber','docTitle','ourRef','project','custId','attention','yourRef','poNumber','billName','billAddr','delName','delAddr','dateInvoice','dateSupply'].forEach(id=>{const el=document.getElementById(id);if(el&&id in inv)inv[id]=el.value});
  // due date
  const t=inv.terms, di=inv.dateInvoice;
  let due='';
  if(di){if(t==='Advance')due=di;else{const d=parseInt((t.match(/\d+/)||[0])[0]);due=addDays(di,d)}}
  document.getElementById('dueDate').value=due;
  render(); persist();
  if(curStep===4&&typeof renderReview==='function')renderReview();
}
function persist(){save('draft',inv)}
function validate(){
  const c=compute();const it=[];
  const dt=CONFIG.docTypes[inv.mode]||CONFIG.docTypes.proforma;
  const docLabel=dt.numLabel;
  if(!inv.docNumber||!inv.docNumber.trim())it.push(docLabel+' is required');
  if(!inv.dateInvoice)it.push('Date of Invoice is required');
  if(dt.showSupply&&!inv.dateSupply)it.push('Date of Supply is required on a '+dt.label.toLowerCase());
  if(!inv.billName||!inv.billName.trim())it.push('Bill To name is required');
  if(!inv.billAddr||!inv.billAddr.trim())it.push('Bill To address is required');
  const lines=c.rows.filter(r=>r.filled);
  if(lines.length===0)it.push('At least one line item is required');
  if(lines.some(r=>!(parseFloat(r.qty)>0)))it.push('Every line needs a quantity greater than zero');
  if(!(parseFloat(inv.rate)>0))it.push('A USD → AED rate is required');
  return it;
}

/* ---------- customers (Phase 2 — live Bigin lookup) ---------- */
const BRIDGE='https://launch4power.app.n8n.cloud/webhook/bigin-bridge';
let liveCompanies=[];   // last deduped live search results
let activeBiginId='';   // Bigin account id of the picked customer
let activeBiginName=''; // Bigin account name of the picked customer
let activeDealId='';    // Bigin deal id of the linked deal (Phase 3 write-back)
let activeDeal=null;    // {id,name,stage,pipeline,...} of the linked deal
let custSrch=null;      // debounce handle

function setStatus(msg,kind){ // kind: '' | 'live' | 'warn'
  const el=document.getElementById('custStatus');if(!el)return;
  el.textContent=msg;
  el.style.color = kind==='warn' ? '#DC2626' : (kind==='live' ? '#0FB39A' : 'var(--mut)');
}
async function bridge(params){
  const url=BRIDGE+'?'+new URLSearchParams(params).toString();
  const r=await fetch(url,{method:'GET'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function dedupeByName(arr){
  const seen=new Set();const out=[];
  arr.forEach(c=>{const k=(c.name||'').trim().toLowerCase();if(k&&!seen.has(k)){seen.add(k);out.push(c)}});
  return out;
}
function searchLocal(q){ // offline fallback against the local seed
  q=q.toLowerCase();
  return customers.map((c,i)=>({src:'local',i,name:c.label}))
    .filter(o=>o.name.toLowerCase().includes(q));
}
function renderResults(items,emptyMsg){
  const box=document.getElementById('custResults');const inp=document.getElementById('custSearch');
  if(!box)return;
  box.innerHTML = items.length
    ? items.map((o,k)=>`<div class="ac-item" data-k="${k}" onmousedown="chooseResult(${k})">${esc(o.name)}${o.sub?`<span class="sub">${esc(o.sub)}</span>`:''}</div>`).join('')
    : `<div class="ac-empty">${esc(emptyMsg||'No matches.')}</div>`;
  box._items=items;box._sel=-1;
  box.style.display='';if(inp)inp.setAttribute('aria-expanded','true');
}
function hideResults(){
  const box=document.getElementById('custResults');const inp=document.getElementById('custSearch');
  if(box)box.style.display='none';if(inp)inp.setAttribute('aria-expanded','false');
}
function chooseResult(k){
  const box=document.getElementById('custResults');if(!box||!box._items)return;
  const o=box._items[k];if(!o)return;
  document.getElementById('custSearch').value=o.name;
  hideResults();selectCompany(o);
}
function initCustomerSearch(){
  const inp=document.getElementById('custSearch');if(!inp)return;
  inp.addEventListener('input',()=>{
    clearTimeout(custSrch);
    const q=inp.value.trim();
    if(q.length<2){hideResults();setStatus('Type at least two characters to search Bigin.','');return}
    setStatus('Searching Bigin…','');
    custSrch=setTimeout(async()=>{
      try{
        const res=await bridge({action:'search_companies',q});
        liveCompanies=dedupeByName(res.companies||[]);
        if(liveCompanies.length){
          renderResults(liveCompanies.map((c,i)=>({src:'live',i,name:c.name,sub:[c.billCity,c.billCountry].filter(Boolean).join(', ')})));
          setStatus(liveCompanies.length+' match'+(liveCompanies.length>1?'es':'')+' in Bigin.','live');
        }else{
          const loc=searchLocal(q);renderResults(loc,'No Bigin matches.');
          setStatus('No Bigin matches'+(loc.length?' — showing local list.':'.'),'warn');
        }
      }catch(e){
        const loc=searchLocal(q);renderResults(loc,'Bigin unreachable.');
        setStatus('Bigin unreachable — showing local list.','warn');
      }
    },350);
  });
  inp.addEventListener('keydown',e=>{
    const box=document.getElementById('custResults');
    if(!box||box.style.display==='none')return;
    const items=box.querySelectorAll('.ac-item');if(!items.length)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      box._sel=(box._sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
      items.forEach((el,idx)=>el.classList.toggle('on',idx===box._sel));
      items[box._sel].scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){ if(box._sel>=0){e.preventDefault();chooseResult(box._sel)} }
    else if(e.key==='Escape'){ hideResults() }
  });
  inp.addEventListener('blur',()=>setTimeout(hideResults,150));
}
function resetSubPickers(){
  const cs=document.getElementById('contactSel');const dw=document.getElementById('dealWrap');
  if(cs){cs.style.display='none';cs.innerHTML=''}
  if(dw){dw.style.display='none'}
  const cw=document.getElementById('createDealWrap');if(cw)cw.style.display='none';
}
function composeAddr(c){
  const l2=[c.billCity,c.billState].filter(Boolean).join(', ');
  return [c.billStreet||'',l2,c.billCountry||''].filter(Boolean).join('\n');
}
function selectCompany(o){
  resetSubPickers();
  if(o.src==='local'){
    const c=customers[o.i];activeBiginId='';
    inv.custId=c.id||'';inv.attention=c.attention||'';
    inv.billName=c.bill.name;inv.billAddr=c.bill.addr;
    inv.delName=c.deliver.name;inv.delAddr=c.deliver.addr;
    syncForm();recompute();return;
  }
  const c=liveCompanies[o.i];if(!c)return; // live Bigin pick
  activeBiginId=c.id;activeBiginName=c.name||'';
  const addr=composeAddr(c); // empty in Bigin → typed manually
  inv.custId='';inv.attention='';
  inv.billName=c.name;inv.billAddr=addr;
  inv.delName=c.name;inv.delAddr=addr;
  syncForm();recompute();
  const cw=document.getElementById('createDealWrap');if(cw)cw.style.display='';
  loadContacts(c.id);loadDeals(c.id);
}
async function loadContacts(id){
  try{
    const res=await bridge({action:'get_company',id});
    const cs=document.getElementById('contactSel');if(!cs)return;
    const list=res.contacts||[];
    if(!list.length){cs.style.display='none';return}
    cs.innerHTML='<option value="-1">— select contact for Attention —</option>'
      +list.map((c,i)=>`<option value="${i}">${esc(c.name)}${c.email?(' · '+esc(c.email)):''}</option>`).join('');
    cs.style.display='';cs._list=list;
  }catch(e){/* Attention stays manual */}
}
function pickContact(){
  const cs=document.getElementById('contactSel');const i=parseInt(cs.value);
  if(!(i>=0)||!cs._list)return;
  inv.attention=cs._list[i].name||'';
  syncForm();recompute();
}
async function loadDeals(id){
  activeDealId='';activeDeal=null;
  try{
    const res=await bridge({action:'list_deals',id});
    const dw=document.getElementById('dealWrap');const ds=document.getElementById('dealSel');
    if(!dw||!ds)return;
    const list=res.deals||[];
    if(!list.length){dw.style.display='none';return}
    ds.innerHTML='<option value="-1">— don’t link —</option>'
      +list.map((d,i)=>`<option value="${i}">${esc(d.name)}${d.ourRef?(' · '+esc(d.ourRef)):''}${d.stage?(' · '+esc(d.stage)):''}</option>`).join('');
    dw.style.display='';ds._list=list;
  }catch(e){/* deals optional */}
}
function pickDeal(){
  const ds=document.getElementById('dealSel');const i=parseInt(ds.value);
  if(!(i>=0)||!ds._list){activeDealId='';activeDeal=null;return}
  const d=ds._list[i];
  activeDeal=d;activeDealId=d.id||'';
  inv.ourRef=d.ourRef||'';   // Our Ref only — never the customer's Your Ref
  syncForm();recompute();
}

/* ---------- mode ---------- */
function setMode(m){
  if(!CONFIG.docTypes[m])m='proforma';
  const dt=CONFIG.docTypes[m];
  inv.mode=m;
  const sel=document.getElementById('docTypeSel');if(sel)sel.value=m;
  document.getElementById('lblNum').textContent=dt.numLabel.replace('#','No.');
  const titles=Object.values(CONFIG.docTypes).map(d=>d.title);
  if(!inv.docTitle||titles.includes(inv.docTitle))inv.docTitle=dt.title;
  const logBtn=document.getElementById('logBtn');
  if(dt.logStage){logBtn.textContent='Log to Bigin → '+dt.logStage.stage;logBtn.disabled=false;logBtn.style.opacity='';}
  else{logBtn.textContent='Attach to Bigin';logBtn.disabled=false;logBtn.style.opacity='';}
  const lb2=document.getElementById('logBtn2');
  if(lb2)lb2.textContent=dt.logStage?('Log to Bigin → '+dt.logStage.stage):'Attach to Bigin';
  // pricing-only controls
  document.querySelectorAll('[data-pricing]').forEach(el=>{el.style.display=dt.pricing?'':'none'});
  syncForm();recompute();
}
function initDocTypes(){
  const sel=document.getElementById('docTypeSel');if(!sel)return;
  sel.innerHTML=Object.entries(CONFIG.docTypes).map(([k,d])=>`<option value="${k}">${d.label}</option>`).join('');
}
let curStep=1;
function goStep(n){
  n=Math.max(1,Math.min(4,n));curStep=n;
  document.querySelectorAll('.wstep').forEach(s=>s.classList.toggle('on',+s.dataset.step===n));
  document.querySelectorAll('.wtab').forEach(t=>{const s=+t.dataset.s;t.classList.toggle('on',s===n);t.classList.toggle('done',s<n)});
  const back=document.getElementById('wback'),next=document.getElementById('wnext');
  if(back)back.style.visibility=n===1?'hidden':'';
  if(next)next.style.visibility=n===4?'hidden':'';
  if(n===4)renderReview();
  document.querySelector('.controls').scrollTop=0;
}
function renderReview(){
  const box=document.getElementById('reviewBox');if(!box)return;
  const dt=CONFIG.docTypes[inv.mode]||CONFIG.docTypes.proforma;
  const issues=validate();
  if(!issues.length)box.innerHTML=`<div class="rvok">All required fields complete — this ${esc(dt.label.toLowerCase())} is ready to issue.</div>`;
  else box.innerHTML=`<div class="rvbad"><b>Resolve before issuing:</b><ul>${issues.map(i=>'<li>'+esc(i)+'</li>').join('')}</ul></div>`;
}

/* ---------- file + bigin ---------- */
function saveJSON(){const blob=new Blob([JSON.stringify(inv,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(inv.docNumber||inv.mode)+'.json';a.click()}
function loadJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{inv=JSON.parse(r.result);setMode(inv.mode||'proforma');renderItems();syncForm();recompute()}catch(err){alert('Could not read file.')}};r.readAsText(f);e.target.value=''}
async function createBiginDeal(){
  if(!activeBiginId){
    alert('Select a live Bigin customer first (search and pick a result), then create the deal.');
    return;
  }
  if(activeDealId){
    if(!confirm('A deal is already linked. Create another new deal in Bigin anyway?'))return;
  }
  const dtLabel=(CONFIG.docTypes[inv.mode]||CONFIG.docTypes.proforma).label;
  const name=(inv.project&&inv.project.trim())||((activeBiginName||inv.billName||'New')+' — '+dtLabel);
  if(!confirm('Create a new opportunity in Bigin\n\n“'+name+'”\nfor '+(activeBiginName||inv.billName||'this customer')+'\nat Quotations : Submit Quotation.\n\nBigin will assign the Our Reference. Proceed?'))return;
  const btn=document.getElementById('createDealBtn');const lbl=btn.textContent;
  btn.disabled=true;btn.textContent='Creating in Bigin…';
  try{
    const res=await bridge({action:'create_deal',account:activeBiginId,name,pipeline:'Quotations',stage:'Submit Quotation'});
    if(res&&res.ok&&res.id){
      activeDealId=res.id;
      activeDeal={id:res.id,name:res.name||name,stage:res.stage||'Submit Quotation',pipeline:'Quotations',ourRef:res.ourRef||''};
      if(res.ourRef)inv.ourRef=res.ourRef;
      syncForm();recompute();
      btn.textContent='Created ✓';setTimeout(()=>{btn.disabled=false;btn.textContent=lbl;},2500);
      alert('Deal created in Bigin.\n\nOur Reference: '+(res.ourRef||'(assigned — refresh the deal in Bigin if blank)'));
    }else{
      btn.disabled=false;btn.textContent=lbl;
      alert('Could not create the deal in Bigin'+(res&&res.message?(':\n'+res.message):'.')+'\n\nIf this was just set up, the bridge may still need its credential attached and publishing.');
    }
  }catch(e){
    btn.disabled=false;btn.textContent=lbl;
    alert('Could not reach the Bigin bridge.\n\n'+(e&&e.message?e.message:''));
  }
}
async function logToBigin(){
  if(!activeDealId){
    alert('Link a Bigin deal first.\n\nSearch the customer, pick a live result, then choose the deal under “Link a Bigin deal”. The selected deal is the record that will be moved.');
    return;
  }
  const issues=validate();
  if(issues.length){
    alert('Resolve these before logging to Bigin:\n\n• '+issues.join('\n• '));
    return;
  }
  const target=(CONFIG.docTypes[inv.mode]||CONFIG.docTypes.proforma).logStage;
  if(!target){
    alert('This document type doesn’t move a deal stage.\n\nAttaching the PDF to the Bigin record will be enabled with the document renderer.');
    return;
  }
  const dn=(activeDeal&&activeDeal.name)||'this deal';
  const from=(activeDeal&&activeDeal.pipeline&&activeDeal.stage)?(activeDeal.pipeline+' : '+activeDeal.stage):'its current stage';
  if(!confirm('Move Bigin deal\n\n“'+dn+'”\n\nfrom  '+from+'\nto    '+target.pipeline+' : '+target.stage+'\n\nProceed? This updates the record in Bigin.')) return;
  const btn=document.getElementById('logBtn');const label=btn.textContent;
  btn.disabled=true;btn.textContent='Moving in Bigin…';
  try{
    const res=await bridge({action:'move_deal',id:activeDealId,pipeline:target.pipeline,stage:target.stage});
    if(res&&res.ok){
      if(activeDeal){activeDeal.pipeline=target.pipeline;activeDeal.stage=target.stage;}
      btn.textContent='Moved → '+target.stage+' ✓';
      setTimeout(()=>{btn.disabled=false;btn.textContent=label;},2500);
      alert('Done. “'+dn+'” moved to '+target.pipeline+' : '+target.stage+' in Bigin.');
    }else{
      btn.disabled=false;btn.textContent=label;
      alert('Bigin did not confirm the move'+(res&&res.message?(':\n'+res.message):'.')+'\n\nThe record was not changed. Check the deal link and try again.');
    }
  }catch(e){
    btn.disabled=false;btn.textContent=label;
    alert('Could not reach the Bigin bridge.\n\n'+(e&&e.message?e.message:'')+'\n\nCheck your connection and try again.');
  }
}

/* ---------- init ---------- */
function init(){
  // Always start blank on load / hard refresh — do not restore previous document.
  try{localStorage.removeItem('4p_inv_draft')}catch(e){}
  inv=blank('proforma');
  bind();initCustomerSearch();initDocTypes();renderCat();renderItems();setMode(inv.mode||'proforma');goStep(1);
  const sheetEl=document.getElementById('sheet');
  sheetEl.addEventListener('input',e=>{const el=e.target.closest('.ed');if(!el)return;
    const f=el.getAttribute('data-field');if(!f)return;
    inv[f]=el.textContent.replace(/\u00a0/g,' ');
    const pin=document.getElementById(f);if(pin&&'value'in pin)pin.value=inv[f];
    persist();if(curStep===4&&typeof renderReview==='function')renderReview();});
  sheetEl.addEventListener('keydown',e=>{const el=e.target.closest('.ed');if(el&&e.key==='Enter'){e.preventDefault();el.blur();}});
}
init();
</script>
</body>
